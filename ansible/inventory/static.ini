# static.ini — placeholder for development / pre-Terraform state.
# After `make tf-config`, ansible/inventory/dynamic.ini is written by Terraform.
# This file is only used for `make ansible-ping` before Terraform has run.

[openshift_cluster]
localhost ansible_connection=local

[vault_cluster]
# populated by terraform/vault-config/inventory.tf after make tf-config

[all:vars]
sg_namespace=shift-gear
vault_namespace=shift-gear
