---
# ansible/roles/sg_configure/tasks/secrets.yml
# Generate postgres-admin password once (stored in Vault KV), write
# Kubernetes Secrets postgres-admin and sg-ca-secret in sg-workloads.

- name: Manage Postgres admin secret in Vault KV
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ sg_configure_vault_ca }}"
      headers:
        X-Vault-Token: "{{ sg_vault_token }}"
        X-Vault-Namespace: "shift-gear"
  no_log: true
  block:
    - name: Read existing postgres KV secret
      ansible.builtin.uri:
        url: "{{ sg_configure_vault_addr }}/v1/{{ sg_configure_kv_mount }}/data/{{ sg_configure_postgres_kv_path }}"
        status_code: [200, 404]
      check_mode: false
      register: sg_configure_pg_read
      retries: 3
      delay: 3
      until: sg_configure_pg_read.status in [200, 404]

    - name: Generate and store postgres-admin password (first run only)
      ansible.builtin.uri:
        url: "{{ sg_configure_vault_addr }}/v1/{{ sg_configure_kv_mount }}/data/{{ sg_configure_postgres_kv_path }}"
        method: POST
        body_format: json
        body:
          data:
            admin_password: "{{ lookup('ansible.builtin.password', '/dev/null',
                                      length=32, chars=['ascii_letters', 'digits']) }}"
        status_code: [200, 204]
      changed_when: true
      when: sg_configure_pg_read.status == 404

    - name: Re-read to get the definitive value
      ansible.builtin.uri:
        url: "{{ sg_configure_vault_addr }}/v1/{{ sg_configure_kv_mount }}/data/{{ sg_configure_postgres_kv_path }}"
        status_code: [200]
      check_mode: false
      # Its own register: a skipped task that reused sg_configure_pg_read would
      # overwrite the first read with a result that has no json.
      register: sg_configure_pg_reread
      when: sg_configure_pg_read.status == 404

    - name: Expose postgres admin password (memory only)
      ansible.builtin.set_fact:
        sg_configure_pg_password: >-
          {{ (sg_configure_pg_reread if sg_configure_pg_reread is not skipped else sg_configure_pg_read)
             .json.data.data.admin_password }}

- name: Ensure postgres-admin Kubernetes Secret in sg-workloads
  kubernetes.core.k8s:
    kubeconfig: "{{ sg_configure_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: postgres-admin
        namespace: sg-workloads
      type: Opaque
      stringData:
        password: "{{ sg_configure_pg_password }}"
  no_log: true

- name: Ensure sg-ca-secret in sg-workloads (public CA only)
  # sg-ca-secret is referenced by the VaultConnection caCertSecretRef.
  # Only the public CA cert goes here — no private key.
  kubernetes.core.k8s:
    kubeconfig: "{{ sg_configure_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sg-ca-secret
        namespace: sg-workloads
      type: Opaque
      stringData:
        ca.crt: "{{ lookup('file', playbook_dir + '/../.secrets/tls/pub/ca.pem') }}"
