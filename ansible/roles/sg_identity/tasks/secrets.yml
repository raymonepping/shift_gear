---
# ansible/roles/sg_identity/tasks/secrets.yml
# Generate identity secrets once, store under kv/data/shift-gear/identity in
# the shift-gear namespace. Read back on every subsequent run. No value on
# disk. Then write the two Kubernetes Secrets that the Deployments reference.
# All tasks are no_log: the block is entered only when sg_vault_token is set.

- name: Manage identity secrets in Vault KV
  module_defaults:
    ansible.builtin.uri:
      ca_path: "{{ sg_identity_vault_ca }}"
      headers:
        X-Vault-Token: "{{ sg_vault_token }}"
        X-Vault-Namespace: "shift-gear"
  no_log: true
  block:
    - name: Read current identity secrets from Vault KV
      ansible.builtin.uri:
        url: "{{ sg_identity_vault_addr }}/v1/{{ sg_identity_kv_mount }}/data/{{ sg_identity_kv_path }}"
        status_code: [200, 404]
      check_mode: false
      register: sg_identity_secrets_read
      retries: 5
      delay: 3
      until: sg_identity_secrets_read.status in [200, 404]

    - name: Determine existing secrets
      ansible.builtin.set_fact:
        sg_identity_secrets_current: >-
          {{ sg_identity_secrets_read.json.data.data
             if sg_identity_secrets_read.status == 200
             else {} }}

    - name: Determine required secret keys (static + one per user)
      ansible.builtin.set_fact:
        sg_identity_secrets_wanted: >-
          {{ sg_identity_secret_keys
             + (sg_identity_users | map(attribute='uid') | map('regex_replace', '^', 'user_') | list) }}

    - name: Generate missing secrets
      ansible.builtin.set_fact:
        sg_identity_secrets_generated: >-
          {{ sg_identity_secrets_generated | default({})
             | combine({item: lookup('ansible.builtin.password', '/dev/null',
                                     length=32,
                                     chars=['ascii_letters', 'digits'])}) }}
      loop: "{{ sg_identity_secrets_wanted | difference(sg_identity_secrets_current.keys() | list) }}"

    - name: Store the completed secret set (only when new secrets were generated)
      ansible.builtin.uri:
        url: "{{ sg_identity_vault_addr }}/v1/{{ sg_identity_kv_mount }}/data/{{ sg_identity_kv_path }}"
        method: POST
        body_format: json
        body:
          data: "{{ sg_identity_secrets_current | combine(sg_identity_secrets_generated | default({})) }}"
        status_code: [200, 204]
      changed_when: true
      when: sg_identity_secrets_generated | default({}) | length > 0

    - name: Expose consolidated secrets to later tasks (in-memory only)
      ansible.builtin.set_fact:
        sg_identity_secrets_values: >-
          {{ sg_identity_secrets_current
             | combine(sg_identity_secrets_generated | default({})) }}

# ── Kubernetes Secrets (changed only when value changed) ─────────────────────

- name: Ensure openldap-admin Kubernetes Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ sg_identity_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: openldap-admin
        namespace: sg-identity
      type: Opaque
      stringData:
        password: "{{ sg_identity_secrets_values.ldap_admin_password }}"
  no_log: true

- name: Ensure keycloak-admin Kubernetes Secret
  kubernetes.core.k8s:
    kubeconfig: "{{ sg_identity_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: keycloak-admin
        namespace: sg-identity
      type: Opaque
      stringData:
        username: admin
        password: "{{ sg_identity_secrets_values.keycloak_admin_password }}"
  no_log: true

# keycloak-tls is applied by scripts/tls.sh (ansible prepare phase) in sg-identity.
# No action needed here.
