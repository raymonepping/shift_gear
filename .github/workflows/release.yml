name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Require protected live proof for this revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision=$(git rev-parse HEAD)
          proof_run=$(gh run list --workflow live-proof.yml --commit "$revision" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$proof_run"
          gh run download "$proof_run" --name shift-gear-live-proof --dir .proof
          python3 scripts/verify-proof.py .proof/proof-manifest.json "$revision"
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists — skipping."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
