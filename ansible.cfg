[defaults]
inventory           = ansible/inventory/localhost.yml
roles_path          = ansible/roles
collections_path    = .cache/ansible/collections
callback_plugins    = ./ansible/plugins/callback
callbacks_enabled   = sg_stats, ansible.posix.profile_tasks
interpreter_python  = auto_silent
stdout_callback     = ansible.builtin.default
result_format       = yaml
retry_files_enabled = False
gathering           = smart
fact_caching        = jsonfile
fact_caching_connection = .cache/ansible/facts
fact_caching_timeout = 86400

[inventory]
enable_plugins = host_list, yaml, ini

[ssh_connection]
# No SSH in Shift Gear — Ansible connects to Vault APIs through Routes and to
# OpenShift with kubernetes.core. There is no SSH anywhere.
pipelining = False
