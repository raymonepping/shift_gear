---
# addons/rotation/ansible/rotation-configure.yml — the add-on's Vault
# configuration (sg-ansible-platform): the controller's Kubernetes auth role and
# the internal identity groups. Runs before Terraform starts the pod, so the
# agent's first login succeeds.
- name: KV rotation add-on — configure Vault
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: [vars.yml]
  pre_tasks:
    - name: Preamble
      ansible.builtin.import_tasks: tasks/preamble.yml
  roles:
    - sg_rotation_vault
