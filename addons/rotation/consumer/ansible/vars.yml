---
# addons/rotation/consumer/ansible/vars.yml — non-secret settings for the Secure Door playbooks.
sg_rotation_consumer_root: "{{ playbook_dir }}/../../../.."
sg_rotation_consumer_vault_addr: "https://vault.{{ infra_cluster.apps_domain }}"
sg_rotation_consumer_vault_ca: "{{ sg_rotation_consumer_root }}/.secrets/tls/pub/ca.pem"
sg_rotation_consumer_ingress_ca: "{{ sg_rotation_consumer_root }}/.secrets/kube/ingress-ca.pem"
sg_rotation_consumer_vault_namespace: shift-gear
sg_rotation_consumer_k8s_namespace: sg-rotation-consumer
sg_rotation_consumer_secret_rel: shift-gear/rotation/api-key/secure-door
sg_rotation_consumer_board_url: "https://secure-door.{{ infra_cluster.apps_domain }}"
sg_rotation_consumer_build_dir: "{{ sg_rotation_consumer_root }}/.build/addons/rotation"

# The Vault Agent's Kubernetes auth role: projected token (audience vault),
# one read-only policy, declared in full (lesson 4).
sg_rotation_consumer_k8s_role:
  bound_service_account_names: ["secure-door"]
  bound_service_account_namespaces: ["sg-rotation-consumer"]
  audience: vault
  policies: ["sg-rotation-consumer"]
  token_ttl: 1200
  token_max_ttl: 3600
